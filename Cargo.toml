[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/wire",
    "crates/hook-bridge",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Francisco Nadal"]
license = "MIT"

[workspace.dependencies]
awr-domain = { path = "crates/domain" }
awr-application = { path = "crates/application" }
awr-infrastructure = { path = "crates/infrastructure" }
awr-wire = { path = "crates/wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
